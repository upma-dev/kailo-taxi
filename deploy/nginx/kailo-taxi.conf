# Kailo Taxi: one domain, one Nginx config (same layout as the "FULL DEPLOYMENT SOP").
#
#   https://YOUR_DOMAIN/            -> React build   (/var/www/kailo-taxi)
#   https://YOUR_DOMAIN/api/        -> Express API   (127.0.0.1:5000)
#   https://YOUR_DOMAIN/socket.io/  -> Socket.IO     (127.0.0.1:5001)
#   https://YOUR_DOMAIN/uploads/    -> images on the VPS disk (/var/www/uploads), served directly by Nginx
#
# Install: sudo cp kailo-taxi.conf /etc/nginx/sites-available/kailo-taxi.conf
#          (replace YOUR_DOMAIN everywhere first), then enable it and run certbot (see deploy/README.md).
# This file is HTTP only on purpose: `certbot --nginx` adds the 443/SSL block and the http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/kailo-taxi;
    index index.html;

    # Phone photos are compressed by sharp (libvips) in the backend, but the raw upload can still be big.
    client_max_body_size 10M;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---------- React app ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build files never change: cache hard.
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The HTML shell, the push service worker and the PWA files must always be re-checked,
    # otherwise users keep an old app (and an old Firebase config) after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ---------- Uploaded images (written by the backend, served by Nginx) ----------
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # ---------- Health / readiness ----------
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ready {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Backend API ----------
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn perip 30;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }

    # ---------- Socket.IO (live ride + driver location) ----------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A driver keeps the socket open for the whole trip: do not let Nginx drop it as idle.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }
}
